version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-your_secret_key}
      - JWT_EXPIRE=24h
      - NODE_ENV=production
    container_name: scalable-api-backend

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    container_name: scalable-api-frontend
    depends_on:
      - backend

